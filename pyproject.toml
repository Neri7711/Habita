[project]
name = "arraigo"
version = "0.1.0"
description = "Agente asesor de vivienda para personas que se reubican a CDMX"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11",
    "pandas>=2.2",
    "mcp<2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arraigo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
